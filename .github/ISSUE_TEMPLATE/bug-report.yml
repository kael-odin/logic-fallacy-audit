name: 工具或报告缺陷
description: 报告校验器、生成器、CLI、文档链接或报告流程问题
title: "[缺陷] "
labels:
  - bug
body:
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 请提供命令、输入和最关键的输出
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现
      description: 不要包含密钥、个人信息或未授权数据
      placeholder: |
        1. 运行 ...
        2. 看到 ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Python 3.13 / commit SHA
    validations:
      required: true
