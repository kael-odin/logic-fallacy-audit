name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install linter
        run: python -m pip install "ruff==0.16.5"
      - name: Lint Python
        run: ruff check scripts tests
      - name: Check Python formatting
        run: ruff format --check scripts tests
      - name: Validate sample report
        run: python scripts/report_lint.py examples/sample-report.md --profile full --strict
      - name: Validate explainer report
        run: python scripts/report_lint.py examples/explainer-report.md --profile explainer --strict
      - name: Validate valid-argument report
        run: python scripts/report_lint.py examples/valid-argument-report.md --profile full --strict
      - name: Validate English report with source locations
        run: python scripts/report_lint.py examples/sample-report.en.md --profile full --strict --source examples/long-text-source.txt --require-locators
      - name: Validate teaching report
        run: python scripts/report_lint.py examples/teaching-report.md --profile teaching --strict
      - name: Validate Mermaid diagram generation
        run: python scripts/fallacy_cli.py diagram examples/sample-report.md --kind compare > /dev/null
      - name: Check regression dashboard
        run: python scripts/fallacy_cli.py regression-dashboard --check
      - name: Check model-run dashboard
        run: python scripts/eval_runner.py dashboard --check

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate catalog and repository
        run: python scripts/fallacy_cli.py validate --strict
      - name: Validate knowledge coverage audit
        run: python scripts/fallacy_cli.py coverage --json > /dev/null
      - name: Check generated catalog
        run: python scripts/fallacy_cli.py render --check
      - name: Validate long-text source workflow
        run: |
          python scripts/fallacy_cli.py segment examples/long-text-source.txt --max-chars 80 --json > /dev/null
          python scripts/fallacy_cli.py locate examples/long-text-source.txt --quote "三个人的经历" --json > /dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
