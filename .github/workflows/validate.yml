name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install linter
        run: python -m pip install "ruff==0.16.5"
      - name: Lint Python
        run: ruff check scripts tests
      - name: Check Python formatting
        run: ruff format --check scripts tests

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate catalog and repository
        run: python scripts/fallacy_cli.py validate --strict
      - name: Check generated catalog
        run: python scripts/fallacy_cli.py render --check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
