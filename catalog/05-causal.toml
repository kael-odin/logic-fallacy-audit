[[fallacy]]
id = "hasty-generalization"
name_zh = "草率概括"
name_en = "Hasty Generalization"
aliases = ["以偏概全", "样本不足概括"]
category = "causal"
kind = "informal"
severity = 3
definition = "从数量很少、代表性不足或来源单一的样本，推出适用范围更广的一般结论。"
pattern = "少数样本 x1…xn 具有 F；因此目标总体 G 大体或全部具有 F。"
diagnostic = ["样本如何选出，能否代表目标总体？", "结论范围是否远大于样本覆盖范围？", "是否存在与结论相反但未纳入的案例？"]
example = "我认识的三个创业者都成功了，所以创业只要敢做就能成功。"
boundary = "小样本可以提供线索或个案证据；问题在于把线索升级为总体结论。"
confusions = ["轶事证据", "代表性启发", "统计样本"]
related = ["sweeping-generalization", "anecdotal-evidence", "selection-bias"]

[[fallacy]]
id = "sweeping-generalization"
name_zh = "过度概括"
name_en = "Sweeping Generalization"
aliases = ["绝对化概括", "无视例外"]
category = "causal"
kind = "informal"
severity = 2
definition = "把一条有合理例外或适用范围的原则，使用成没有例外的全称规则。"
pattern = "原则上通常 P；因此在所有情况下都必须 P，且无例外。"
diagnostic = ["原规则是否本来就带范围、程度或例外？", "当前案例是否落在已知例外条件中？"]
example = "运动有益健康，所以任何病人在任何情况下都应该高强度训练。"
boundary = "规范原则可以是绝对规则，但需要明确来源；经验规律通常有例外。"
confusions = ["hasty generalization", "例外滥用", "规则应用"]
related = ["hasty-generalization", "special-pleading", "illicit-minor"]

[[fallacy]]
id = "anecdotal-evidence"
name_zh = "轶事证据"
name_en = "Anecdotal Evidence"
aliases = ["个例证明", "我朋友说"]
category = "causal"
kind = "informal"
severity = 2
definition = "用个别、自选或难以核验的故事支持普遍因果或政策结论。"
pattern = "一个故事显示 P；因此总体 P 很可能成立。"
diagnostic = ["该故事如何被选中，失败案例是否被遗漏？", "故事能证明存在可能，还是能估计总体频率与因果效应？"]
example = "我邻居吃了这种保健品后精神很好，所以它对所有人都有效。"
boundary = "个案对发现风险、提出假设、说明体验很有价值；但不能单独估计一般效果。"
confusions = ["案例研究", "hasty generalization", "misleading vividness"]
related = ["hasty-generalization", "misleading-vividness", "selection-bias"]

[[fallacy]]
id = "misleading-vividness"
name_zh = "生动性误导"
name_en = "Misleading Vividness"
aliases = ["生动个例压过统计", "可记忆性偏差"]
category = "causal"
kind = "informal"
severity = 2
definition = "一个情绪强烈、画面鲜明或容易回忆的案例，被赋予超过数据应有的证据权重。"
pattern = "生动案例 E 支持 P；因此忽略更大样本或基准率而接受 P。"
diagnostic = ["该案例是否因为罕见、戏剧化或情绪强而更醒目？", "总体数据和基准率显示了什么？"]
example = "一次坠机新闻让人认为坐飞机比开车危险，尽管统计风险相反。"
boundary = "鲜明案例可说明潜在机制和受害规模；不能替代频率估计。"
confusions = ["availability heuristic", "anecdotal evidence", "base-rate neglect"]
related = ["anecdotal-evidence", "availability-heuristic", "base-rate-neglect"]

[[fallacy]]
id = "slothful-induction"
name_zh = "懒惰归纳"
name_en = "Slothful Induction"
aliases = ["拒绝归纳", "证据够了仍不承认"]
category = "causal"
kind = "informal"
severity = 2
definition = "面对重复、稳定且总体一致的模式，仍以“可能只是巧合”为由拒绝任何归纳结论，却不给替代解释。"
pattern = "大量独立观察支持 P；作者只重复“不能百分百确定”；因此不作任何暂定结论。"
diagnostic = ["是否存在比 P 更好的替代解释？", "证据是否已达到合理决策门槛，而作者把绝对确定当成门槛？"]
example = "连续五年每个季度销量下降，他却说这只是偶然，拒绝考虑市场变化。"
boundary = "审慎要求确认替代解释是合理的；不能把“可能有未知因素”无限变成拒绝所有证据。"
confusions = ["科学审慎", "不可证伪", "slothful induction"]
related = ["regression-fallacy", "unfalsifiability", "moving-the-goalposts"]

[[fallacy]]
id = "false-cause"
name_zh = "虚假因果"
name_en = "False Cause"
aliases = ["乱因谬误", "非因果归因", "错误归因"]
category = "causal"
kind = "informal"
severity = 3
definition = "在没有足够因果证据时，把共同出现、先后发生或象征关联当成因果关系。"
pattern = "A 与 B 相关或先于 B；因此 A 导致 B。"
diagnostic = ["是否存在共同原因、反向因果或选择偏差？", "时序、机制、剂量反应和对照是否支持因果？"]
example = "这个城市冰淇淋销量上升后犯罪率也上升，所以冰淇淋导致犯罪。"
boundary = "无法排除所有混杂不意味着因果为零；需要评估总体证据强度。"
confusions = ["post hoc", "cum hoc", "single cause"]
related = ["post-hoc", "cum-hoc", "causal-oversimplification"]

[[fallacy]]
id = "post-hoc"
name_zh = "事后归因"
name_en = "Post Hoc Ergo Propter Hoc"
aliases = ["在此之后所以因此", "时序因果"]
category = "causal"
kind = "informal"
severity = 3
definition = "仅因为 B 在 A 之后发生，就推出 A 是 B 的原因。"
pattern = "A 先于 B；因此 A 导致 B。"
diagnostic = ["是否只是时间先后，而没有机制和对照？", "同一时期是否有其他变化也能解释 B？", "若没有 A，B 是否仍可能发生？"]
example = "我换了头像后球队连胜，所以头像带来了胜利。"
boundary = "A 先于 B 是因果的必要线索之一；若有机制、重复实验和对照支持，可以形成因果论证。"
confusions = ["false cause", "cum hoc", "causal inversion"]
related = ["false-cause", "cum-hoc", "regression-fallacy"]

[[fallacy]]
id = "cum-hoc"
name_zh = "相关即因果"
name_en = "Cum Hoc Ergo Propter Hoc"
aliases = ["伴随发生所以导致", "相关性谬误"]
category = "causal"
kind = "informal"
severity = 3
definition = "只凭两个变量同时变化或同时存在，就断言其中一个导致另一个。"
pattern = "A 与 B 统计相关；因此 A 导致 B。"
diagnostic = ["反向因果是否同样合理？", "是否存在第三变量同时影响 A 和 B？", "相关是否由选择或分组方式制造？"]
example = "使用某学习软件的学生成绩更高，所以软件一定提升了成绩。"
boundary = "相关性是因果证据之一，尤其在机制、时序和自然实验中相互支持时；不能因可能混杂就忽略全部证据。"
confusions = ["false cause", "post hoc", "selection bias"]
related = ["false-cause", "post-hoc", "selection-bias"]

[[fallacy]]
id = "single-cause"
name_zh = "单一原因谬误"
name_en = "Single Cause Fallacy"
aliases = ["单因解释", "唯一原因假设"]
category = "causal"
kind = "informal"
severity = 2
definition = "把由多因素共同作用的复杂结果归因于一个原因，并排除其他贡献因素。"
pattern = "结果 B 出现；找到一个可能原因 A；因此 A 是唯一或主要充分原因。"
diagnostic = ["结果是否可能由多个必要或促进因素共同造成？", "其他因素的贡献是否被比较或排除？"]
example = "公司项目失败完全是因为一个实习生写错一行代码。"
boundary = "为了解释局部机制可以聚焦一个因素；但不能把聚焦误写成排他性因果结论。"
confusions = ["causal oversimplification", "root cause", "false cause"]
related = ["causal-oversimplification", "false-cause", "fundamental-attribution-error"]

[[fallacy]]
id = "causal-oversimplification"
name_zh = "因果过度简化"
name_en = "Causal Oversimplification"
aliases = ["复杂因果压扁", "单线因果"]
category = "causal"
kind = "informal"
severity = 3
definition = "把有反馈、概率、阈值、相互作用或时间延迟的因果系统，压缩成简单单向链条。"
pattern = "复杂系统 S 中 A 与 B 相关；论证表示为 A → B，忽略条件 C 和反馈 F。"
diagnostic = ["因果关系是否有条件、剂量、阈值或双向反馈？", "简化是否改变了政策或责任结论？"]
example = "提高奖金一定提高效率，因为员工收入越高越努力。"
boundary = "所有模型都是简化；评估重点是简化是否保留了影响当前结论的关键结构。"
confusions = ["single cause", "false cause", "broken window fallacy"]
related = ["single-cause", "false-cause", "slippery-slope"]

[[fallacy]]
id = "causal-inversion"
name_zh = "因果倒置"
name_en = "Causal Inversion"
aliases = ["反向因果", "结果当原因"]
category = "causal"
kind = "informal"
severity = 3
definition = "把因果方向说反，把结果当成原因，或忽略双方相互影响。"
pattern = "A 与 B 相关；断言 A → B；但更可能或同样可能是 B → A。"
diagnostic = ["哪个变化先发生，时序是否可观察？", "B 是否能反过来影响 A？", "是否存在反馈循环？"]
example = "经常看病的人身体更差，所以看病损害健康。"
boundary = "反向因果必须用机制和时序证据评估；不能仅凭相关性猜测方向。"
confusions = ["cum hoc", "post hoc", "feedback loop"]
related = ["cum-hoc", "post-hoc", "false-cause"]

[[fallacy]]
id = "slippery-slope"
name_zh = "滑坡谬误"
name_en = "Slippery Slope"
aliases = ["多米诺谬误", "一路滑到底"]
category = "causal"
kind = "informal"
severity = 3
definition = "从一个初始变化推出一连串后果，却不证明每一中间步骤的概率、机制和可阻止措施。"
pattern = "A 导致 B，B 导致 C，C 导致灾难 D；因此不能允许 A。"
diagnostic = ["每一段因果链是否有独立证据和概率？", "中间节点是否可以被制度、成本或反作用力阻止？", "比较的是 A 的实际风险，还是想象中的极端终点？"]
example = "允许学生选择一次作业主题，下一步他们就会拒绝所有课程要求，最终学校完全失控。"
boundary = "如果每一步都有机制、历史证据和较低阻断概率，连续后果论证可以成立；它就是风险预测，不是自动谬误。"
confusions = ["domino fallacy", "appeal to fear", "causal chain"]
related = ["appeal-to-fear", "causal-oversimplification", "nirvana-fallacy"]

[[fallacy]]
id = "weak-analogy"
name_zh = "弱类比"
name_en = "Weak Analogy"
aliases = ["不当类比", "错误比较"]
category = "causal"
kind = "informal"
severity = 2
definition = "用两个对象在表面或无关维度上的相似，推出它们在结论相关维度上也相似。"
pattern = "A 与 B 都有 F；结论依赖属性 G；因此 A 与 B 在 G 上也相同。"
diagnostic = ["被比较的相似点是否与结论相关？", "已知差异是否足以破坏类比？", "类比是在提出假设，还是承担了证明？"]
example = "公司像家庭，所以员工应该无条件接受老板安排。"
boundary = "类比主要用于说明、发现假设和扩展模型；强类比需要关键结构相似和独立验证。"
confusions = ["false equivalence", "misleading metaphor", "case comparison"]
related = ["false-equivalence", "misleading-metaphor", "hasty-generalization"]

[[fallacy]]
id = "appeal-to-probability"
name_zh = "诉诸概率"
name_en = "Appeal to Probability"
aliases = ["可能所以一定", "概率当必然"]
category = "causal"
kind = "informal"
severity = 2
definition = "从某结果可能发生或概率较高，推出它当前一定发生或将发生在特定个案。"
pattern = "P 可能或很可能发生；因此 P 已经发生或将发生。"
diagnostic = ["讨论的是群体频率还是单个案例？", "“可能/很可能”被替换成“必然”了吗？"]
example = "航班通常准时，所以这班飞机今天一定不会延误。"
boundary = "概率可以支持合理预期和风险管理；但不能保证单次结果。"
confusions = ["gambler's fallacy", "base-rate neglect", "modal scope"]
related = ["gamblers-fallacy", "base-rate-neglect", "existential-fallacy"]

[[fallacy]]
id = "regression-fallacy"
name_zh = "回归谬误"
name_en = "Regression Fallacy"
aliases = ["均值回归误读", "极端表现因果化"]
category = "causal"
kind = "statistical"
severity = 2
definition = "把极端结果自然回归平均的变化，归因于随后采取的措施。"
pattern = "极端表现 Y1 后自然出现较接近均值的 Y2；因此干预 X 导致了改善。"
diagnostic = ["样本是否因上一次极端分数而被选中？", "如果没有干预，均值回归是否也可能发生？"]
example = "最差的一天后进行严厉批评，第二天表现改善，于是认为批评有效。"
boundary = "干预可能有真实效果；需要对照组或更完整时间序列区分效果与回归。"
confusions = ["post hoc", "selection effect", "regression to mean"]
related = ["post-hoc", "selection-bias", "misleading-average"]

[[fallacy]]
id = "gamblers-fallacy"
name_zh = "赌徒谬误"
name_en = "Gambler's Fallacy"
aliases = ["独立事件补偿", "该轮到我了"]
category = "causal"
kind = "statistical"
severity = 2
definition = "在独立或近似独立事件中，认为过去结果会改变下一次结果的概率。"
pattern = "随机事件连续出现 A；因此下一次更可能出现 B。"
diagnostic = ["事件是否真的独立，系统是否有记忆？", "“长期平均”是否被误用到下一次单次事件？"]
example = "硬币连续五次正面，所以下一次更应该是反面。"
boundary = "若抽取不放回、系统有磨损或结果不独立，过去结果可能改变概率；关键是机制。"
confusions = ["hot hand", "law of large numbers", "regression"]
related = ["hot-hand-fallacy", "appeal-to-probability", "representativeness-heuristic"]

[[fallacy]]
id = "hot-hand-fallacy"
name_zh = "热手谬误"
name_en = "Hot-Hand Fallacy"
aliases = ["连续成功即趋势", "手气正热"]
category = "causal"
kind = "statistical"
severity = 2
definition = "从短时间连续成功推断能力或状态已发生稳定变化，却没有检查真实转移概率。"
pattern = "某人连续成功 k 次；因此下一次成功概率显著更高。"
diagnostic = ["成功率是否高于基准且有足够样本？", "连续序列在随机过程中是否本来就会常见？"]
example = "球员连进三球，所以下一次投篮的命中率一定会更高。"
boundary = "某些真实技能、信心或对手调整确实会产生状态相关；需要数据而非只看连续感。"
confusions = ["gambler's fallacy", "small sample", "clustering illusion"]
related = ["gamblers-fallacy", "hasty-generalization", "regression-fallacy"]

[[fallacy]]
id = "sunk-cost-fallacy"
name_zh = "沉没成本谬误"
name_en = "Sunk Cost Fallacy"
aliases = ["已经投入不能放弃", "沉没成本"]
category = "causal"
kind = "informal"
severity = 2
definition = "因为过去已经投入时间、金钱或声誉而继续一个项目，即使未来收益不再值得继续成本。"
pattern = "已经投入 C；因此必须继续 P，哪怕继续 P 的边际收益为负。"
diagnostic = ["过去的投入能否收回，是否会因继续而变化？", "从今天起比较继续、停止和替代方案的未来成本收益。"]
example = "这部电影票已经买了，即使很难看也要坐到最后。"
boundary = "过去投入可能带来承诺、学习、资产或声誉价值；这些价值需作为未来收益重新计入，而不是凭“不能浪费”。"
confusions = ["承诺一致性", "损失厌恶", "机会成本"]
related = ["loss-aversion", "status-quo-bias", "sunk-cost-bias"]

[[fallacy]]
id = "nirvana-fallacy"
name_zh = "涅槃谬误"
name_en = "Nirvana Fallacy"
aliases = ["完美方案谬误", "完美主义谬误"]
category = "causal"
kind = "informal"
severity = 3
definition = "把现实方案与理想完美方案比较，因为现实方案有缺陷就拒绝它，而不与其他可行方案比较。"
pattern = "P 不能完全解决问题；因此 P 没有价值，应该拒绝。"
diagnostic = ["当前比较对象是否是可行替代，而不是想象中的完美方案？", "P 是否仍能带来净收益或减少损害？"]
example = "这项反腐措施不能根除所有腐败，所以完全没必要实施。"
boundary = "如果方案成本高、副作用大或挤占更好方案，拒绝可以合理；问题在于只用完美标准。"
confusions = ["现实比较", "false dilemma", "causal oversimplification"]
related = ["false-dilemma", "slippery-slope", "perfectionist-fallacy"]

[[fallacy]]
id = "broken-window-fallacy"
name_zh = "破窗谬误"
name_en = "Broken Window Fallacy"
aliases = ["破坏也能创造就业", "有形的机会成本忽视"]
category = "causal"
kind = "informal"
severity = 2
definition = "只看见破坏带来的可见支出和就业，忽略被挤出的资源以及未发生的替代用途。"
pattern = "破坏产生维修需求 B；因此破坏带来净经济收益；忽略本来可用于其他生产的机会 C。"
diagnostic = ["被破坏资源原本还能如何使用？", "新增需求是否挤占其他消费或生产？", "净效应而非仅可见支出是什么？"]
example = "打碎窗户让玻璃工有工作，所以打碎窗户有利于经济。"
boundary = "灾后重建可能带来某些局部机会，但整体净效应仍需计入损失和机会成本。"
confusions = ["机会成本", "零和谬误", "可见性偏差"]
related = ["zero-sum-fallacy", "lump-of-labor", "availability-heuristic"]

[[fallacy]]
id = "lump-of-labor"
name_zh = "劳动总量谬误"
name_en = "Lump of Labor Fallacy"
aliases = ["岗位总数固定", "工作总量固定"]
category = "causal"
kind = "informal"
severity = 2
definition = "假设经济中的岗位数量固定，因此某个群体就业增加必然减少另一个群体就业。"
pattern = "工作岗位总量固定为 N；组 A 获得更多岗位；因此组 B 必然少同样多。"
diagnostic = ["岗位总量是否真的固定？", "生产率变化是否会创造新需求和新职业？", "短期与长期效应是否区分？"]
example = "自动化让机器做一份工作，就必然永久减少一份人类工作。"
boundary = "短期局部替代确实可能发生，特定劳动者也可能受损；不能由此直接推出总体岗位数恒定。"
confusions = ["zero-sum", "short-run vs long-run", "fixed pie"]
related = ["zero-sum-fallacy", "broken-window-fallacy", "status-quo-bias"]

[[fallacy]]
id = "zero-sum-fallacy"
name_zh = "零和谬误"
name_en = "Zero-Sum Fallacy"
aliases = ["固定蛋糕思维", "一方受益必有一方受损"]
category = "causal"
kind = "informal"
severity = 2
definition = "在没有证据时，把互动假设为总量固定的零和关系，忽略正和、负和或分配变化。"
pattern = "A 获得收益；因此 B 必然等量受损。"
diagnostic = ["总价值是否可能增加或减少，而非固定转移？", "双方是否存在合作、交易成本和外部性？"]
example = "学生 A 成绩提高，所以学生 B 一定是被挤下去的。"
boundary = "许多场景确实竞争固定资源，如单一名额或预算；零和假设需要根据制度证明，而非默认。"
confusions = ["机会成本", "竞争关系", "trade-off"]
related = ["broken-window-fallacy", "lump-of-labor", "false-equivalence"]

[[fallacy]]
id = "perfectionist-fallacy"
name_zh = "完美主义标准"
name_en = "Perfectionist Fallacy"
aliases = ["不完美所以无效", "全有或全无"]
category = "causal"
kind = "informal"
severity = 2
definition = "要求方案在所有方面达到完美，否则就把它等同于完全失败或毫无价值。"
pattern = "P 不能达到理想结果 I；因此 P 与零效果无差异。"
diagnostic = ["是否存在可比较的部分改善、风险管理或替代方案？", "评估使用的是绝对标准还是现实基线？"]
example = "这款安全工具不能挡住所有攻击，所以装上它没有意义。"
boundary = "某些安全、医疗或法律标准确实要求通过硬门槛；仍需区分必要门槛与全面完美要求。"
confusions = ["nirvana fallacy", "false dilemma", "risk policy"]
related = ["nirvana-fallacy", "false-dilemma", "causal-oversimplification"]

[[fallacy]]
id = "retrospective-determinism"
name_zh = "事后必然论"
name_en = "Retrospective Determinism"
aliases = ["结果反推必然", "既然发生所以不可避免"]
category = "causal"
kind = "informal"
severity = 2
definition = "因为某事件已经发生，就断言当时的环境使它不可避免，并把事后解释提升为必然因果。"
pattern = "E 已发生，且发生时存在 C；因此 C 必然导致 E。"
diagnostic = ["在事件发生前，C 条件下 E 的概率有多大？", "是否存在未发生的替代结果和阻断因素？"]
example = "球队穿新球鞋后赢了，所以那双鞋使胜利不可避免。"
boundary = "确定性系统可以由定律和初始条件推出结果；复杂社会事件通常仍需概率和反事实比较。"
confusions = ["事后归因", "后见之明偏差", "模态辖域谬误"]
related = ["post-hoc", "hindsight-bias", "modal-scope-fallacy"]
