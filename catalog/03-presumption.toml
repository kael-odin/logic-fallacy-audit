[[fallacy]]
id = "begging-the-question"
name_zh = "乞题"
name_en = "Begging the Question"
aliases = ["预设结论", "循环前提", "petitio principii"]
category = "presumption"
kind = "informal"
severity = 3
definition = "前提以不同措辞重复了待证结论，使论证看似提供理由，实际没有增加独立支持。"
pattern = "要证明 P；前提隐含或等同于 P；因此 P。"
diagnostic = ["前提是否只有接受结论后才可信？", "支持理由是否只是结论的同义改写？"]
example = "这本书一定可信，因为书里每一页都写着它是可信的。"
boundary = "前提与结论主题相同不自动是乞题；前提需要独立可检验，并能增加支持。"
confusions = ["循环论证", "合理背景假设", "定义性真理"]
related = ["circular-reasoning", "self-sealing-argument", "unfalsifiability"]

[[fallacy]]
id = "circular-reasoning"
name_zh = "循环论证"
name_en = "Circular Reasoning"
aliases = ["循环支持", "闭环论证"]
category = "presumption"
kind = "informal"
severity = 3
definition = "多个前提彼此依赖，形成一个没有外部起点的支持闭环。"
pattern = "P 因为 Q；Q 因为 R；R 因为 P。"
diagnostic = ["去掉循环中的一环后，还有任何独立证据吗？", "该链条是否最终回到同一个待证主张？"]
example = "他说的是真的，因为他的消息来源可靠；来源可靠，因为他说来源从不说谎。"
boundary = "某些公理系统、定义网络或互相支持的证据集合可以自洽；问题是有没有独立锚点和可检验输入。"
confusions = ["整体主义证据支持", "乞题", "一致性"]
related = ["begging-the-question", "self-sealing-argument", "unfalsifiability"]

[[fallacy]]
id = "complex-question"
name_zh = "复杂问句"
name_en = "Complex Question"
aliases = ["复合问题", "预设式提问"]
category = "presumption"
kind = "dialectical"
severity = 3
definition = "一个问题把尚未证明的前提藏进问法，使回答者无论答是或否都可能接受该前提。"
pattern = "“你是否已经停止 P？”隐含 P 曾发生。"
diagnostic = ["问题预设了哪些未确认事实？", "回答者能否在不接受预设的情况下直接回答？"]
example = "你打算什么时候停止隐瞒预算？"
boundary = "日常问句可以合理预设背景；问题在于预设是否争议且未给回答者拆开的机会。"
confusions = ["多问题", "诱导性提问", "预设事实"]
related = ["loaded-question", "false-presupposition", "many-questions"]

[[fallacy]]
id = "loaded-question"
name_zh = "诱导性问题"
name_en = "Loaded Question"
aliases = ["陷阱问题", "带节奏提问"]
category = "presumption"
kind = "dialectical"
severity = 3
definition = "通过情绪词、评价性措辞或未经证实的指控塑造答案范围，使问题本身成为说服工具。"
pattern = "用“骗人的报告”“失败的政策”等评价性描述替代中性命名后提问。"
diagnostic = ["问题中的评价词是否已经被证明？", "换成中性词后，答案空间是否改变？"]
example = "你为什么要继续支持这个明显害人的方案？"
boundary = "如果评价已在共同前提或充分证据中成立，带评价词的问题可能是合理概括；但不能循环地预设争议。"
confusions = ["复杂问句", "预设事实", "语气强硬"]
related = ["complex-question", "false-presupposition", "framing-effect"]

[[fallacy]]
id = "false-presupposition"
name_zh = "虚假预设"
name_en = "False Presupposition"
aliases = ["错误前提预设", "预设不存在的事实"]
category = "presumption"
kind = "informal"
severity = 3
definition = "论证或问题把未经支持且可能为假的命题当作背景事实，后续推理因此建立在不稳定基础上。"
pattern = "表达形式预设 P；P 未证明；随后结论依赖 P。"
diagnostic = ["句子要求读者先接受哪项事实？", "如果否定该预设，整段论证是否失去基础？"]
example = "既然所有专家都已经同意新方案，我们只需讨论执行速度。"
boundary = "沟通必须依赖一些常识和共享背景；预设有争议时才需要明示并证明。"
confusions = ["复杂问句", "隐含前提", "背景知识"]
related = ["complex-question", "loaded-question", "equivocation"]

[[fallacy]]
id = "many-questions"
name_zh = "多问题谬误"
name_en = "Fallacy of Many Questions"
aliases = ["打包提问", "复合质询"]
category = "presumption"
kind = "dialectical"
severity = 2
definition = "把多个独立问题或主张包成一个问题，用一个回答压缩不同证据与立场。"
pattern = "“你是否承认 A、B、C？”其中 A、B、C 需要分别判断。"
diagnostic = ["问题包含几个可以独立为真或假的命题？", "统一回答是否会被误读为全部同意？"]
example = "你是否承认预算超支、管理混乱而且项目完全没有价值？"
boundary = "快速质询中打包问题有时便于捕获立场；但若各部分真假独立，仍应拆开回答。"
confusions = ["复杂问句", "连珠炮式提问", "调查问卷设计"]
related = ["complex-question", "gish-gallop", "jaqing-off"]

[[fallacy]]
id = "burden-of-proof-reversal"
name_zh = "举证责任倒置"
name_en = "Burden of Proof Reversal"
aliases = ["谁主张谁举证误置", "要求证明否定"]
category = "presumption"
kind = "dialectical"
severity = 3
definition = "提出肯定主张的一方不提供证据，反而要求质疑者证明该主张为假。"
pattern = "A 提出 P；A 要求 B 证明非 P；在 B 不能证明时宣称 P 成立。"
diagnostic = ["谁主动提出需要改变现状的主张？", "证明否定是否在原则上可行且成本合理？"]
example = "我说这款产品有隐形风险，你没法证明没有，所以风险存在。"
boundary = "举证责任可按领域规则转移，例如无罪推定、监管审慎原则或对方提出反主张；关键是规则要明确且对称。"
confusions = ["合理怀疑", "审慎原则", "认识谦逊"]
related = ["shifting-burden-of-proof", "appeal-to-ignorance", "absence-of-evidence"]

[[fallacy]]
id = "shifting-burden-of-proof"
name_zh = "转移举证责任"
name_en = "Shifting the Burden of Proof"
aliases = ["责任滑移", "反复索取证据"]
category = "presumption"
kind = "dialectical"
severity = 2
definition = "在讨论中不断把举证责任推给对方或新对象，使自己的主张永远无需达到证明门槛。"
pattern = "A 为 P 举证；B 质疑；A 要求 B 先证明 A 错；之后再次转移门槛。"
diagnostic = ["初始主张者是否已经履行自己的责任？", "要求的新证据是否与当前结论成比例，还是无限升级？"]
example = "我提出公司操纵数据；你如果拿不出内部邮件，就不能质疑我；有了邮件后你还要证明老板亲自下令。"
boundary = "随着新主张出现，举证责任确实可以转移；问题在于转移是否合理、门槛是否一致。"
confusions = ["正常对话轮换", "举证责任倒置", "持续追问"]
related = ["burden-of-proof-reversal", "moving-the-goalposts", "sealioning"]

[[fallacy]]
id = "self-sealing-argument"
name_zh = "自我封闭论证"
name_en = "Self-Sealing Argument"
aliases = ["不可反驳的自我验证", "反证吞噬"]
category = "presumption"
kind = "informal"
severity = 3
definition = "论证把所有反证都解释成支持自己或证明对手有问题，使结论无法被任何经验结果削弱。"
pattern = "支持 P 的证据支持 P；反对 P 的证据也被解释为 P 的证据；因此 P 永远成立。"
diagnostic = ["什么观察结果会使该主张被撤回？", "对支持和反对证据是否使用不同标准？"]
example = "如果大家赞同我，说明我说对了；如果大家反对我，说明他们已经被洗脑。"
boundary = "有些理论确实会重新解释异常，只要给出独立机制和可检验预测，就不自动自我封闭。"
confusions = ["不可证伪", "强理论韧性", "阴谋论式推理"]
related = ["unfalsifiability", "circular-reasoning", "heads-i-win-tails-you-lose"]

[[fallacy]]
id = "unfalsifiability"
name_zh = "不可证伪性"
name_en = "Unfalsifiability"
aliases = ["不可反驳主张", "免疫于反证"]
category = "presumption"
kind = "informal"
severity = 3
definition = "主张没有说明任何可能使其为假的观察条件，因此经验证据无法约束它。"
pattern = "无论观察结果如何，P 都能被调整措辞保留。"
diagnostic = ["哪些可观察结果会使 P 为假？", "每次遇到反例后，规则是否被临时改写而没有任何预测成本？"]
example = "这种能量只有在怀疑者观察时才完全不可见，所以任何失败实验都不能反驳它。"
boundary = "不可证伪不直接表示主张为假；形而上学、定义性陈述和某些价值判断也不以经验证伪为主要标准。"
confusions = ["尚未验证", "难验证", "自封论证"]
related = ["self-sealing-argument", "unfalsifiable-conspiracy", "moving-the-goalposts"]

[[fallacy]]
id = "no-true-scotsman"
name_zh = "没有真正的苏格兰人"
name_en = "No True Scotsman"
aliases = ["真正成员谬误", "纯度检验"]
category = "presumption"
kind = "dialectical"
severity = 2
definition = "一般主张遇到反例后，临时增加“真正的成员不会这样”等纯度标准，以保住原命题。"
pattern = "所有 G 都做 P；反例 g 是 G 但不做 P；于是改称 g 不是真正的 G。"
diagnostic = ["“真正”的标准在遇到反例前是否已存在？", "新增定义是否可独立检验，还是只为排除反例？"]
example = "真正的用户从不抱怨；抱怨的人是竞争对手段子，所以不算真正用户。"
boundary = "概念确实可能有必要条件和边界；关键是标准是否事先明确、稳定且有独立依据。"
confusions = ["概念澄清", "移动球门", "定义退守"]
related = ["moving-the-goalposts", "special-pleading", "definitional-retreat"]

[[fallacy]]
id = "special-pleading"
name_zh = "特殊豁免"
name_en = "Special Pleading"
aliases = ["双重标准", "例外豁免"]
category = "presumption"
kind = "dialectical"
severity = 3
definition = "在没有相关差异依据时，给自己的立场、群体或案例设置单独例外。"
pattern = "规则 R 适用于 X；Y 与 X 在相关方面相同；却声称 Y 不受 R，因为它是 Y。"
diagnostic = ["给予例外的依据是否独立于想保护的对象？", "若把对象互换，我是否仍接受同样规则？"]
example = "其他公司发布未经证实的数据是不负责，我们发布是为了速度，所以不算。"
boundary = "不同案例可能在责任、能力或历史条件上确有相关差异；需要说明差异为什么影响规则。"
confusions = ["合理例外", "规范一致性", "no true scotsman"]
related = ["no-true-scotsman", "inconsistent-standards", "tu-quoque"]

[[fallacy]]
id = "moving-the-goalposts"
name_zh = "移动球门"
name_en = "Moving the Goalposts"
aliases = ["目标滑移", "不断提高标准"]
category = "presumption"
kind = "dialectical"
severity = 3
definition = "对方满足原先证据标准后，临时增加新条件或改变目标，使支持永远无法达成。"
pattern = "先要求证据 E；E 出现后，又要求 F；F 出现后，再要求 G。"
diagnostic = ["证据标准是否在开始前明确？", "新要求是原结论真正需要的，还是临时追加？"]
example = "你说只要提供公开记录就承认；记录出来后，你又说必须拿到未公开的录音才行。"
boundary = "调查中确实可能出现新证据要求；若新要求由先前证据揭示，应说明合理联系并统一适用。"
confusions = ["迭代调查", "举证转移", "修定义"]
related = ["no-true-scotsman", "definitional-retreat", "shifting-burden-of-proof"]

[[fallacy]]
id = "proof-by-assertion"
name_zh = "断言式证明"
name_en = "Proof by Assertion"
aliases = ["说了就算", "重复断言"]
category = "presumption"
kind = "informal"
severity = 2
definition = "把主张用确定语气反复陈述，却不提供独立理由或可检验证据。"
pattern = "P 被明确而自信地重复；因此 P 成立。"
diagnostic = ["除了断言本身，是否有任何独立证据？", "语气强度是否被误当成证据强度？"]
example = "这方案绝对没问题，我再说一遍，绝对没问题。"
boundary = "在非正式交流中，重复可用来强调结论；但如果需要证明，强调不能替代理由。"
confusions = ["总结与重复", "修辞强调", "argument by repetition"]
related = ["argument-by-repetition", "argumentum-ad-lapidem", "sealioning"]

[[fallacy]]
id = "argument-by-repetition"
name_zh = "重复论证"
name_en = "Argument by Repetition"
aliases = ["重复即真", "洗脑式重复"]
category = "presumption"
kind = "rhetorical"
severity = 2
definition = "通过高频重复固定措辞或口号，提高熟悉感和接受度，却没有增加支持。"
pattern = "P 被多次重复；受众因此更熟悉 P；熟悉被当作可信。"
diagnostic = ["重复之间是否加入新证据或回答反驳？", "去掉重复次数后，支持是否变化？"]
example = "会议中同一句“市场会接受”被说了二十次，却没有任何用户调研。"
boundary = "重复在记忆、广告和团队沟通中有正当功能；问题在于把熟悉感当成真实性证据。"
confusions = ["口号传播", "可用性启发", "proof by assertion"]
related = ["proof-by-assertion", "availability-heuristic", "thought-terminating-cliche"]

[[fallacy]]
id = "argumentum-ad-lapidem"
name_zh = "诉诸顽石"
name_en = "Argumentum ad Lapidem"
aliases = ["斥为荒谬", "拒绝理由的断言"]
category = "presumption"
kind = "dialectical"
severity = 2
definition = "仅仅宣称某主张荒谬、不可接受或显然错误，却拒绝说明具体理由。"
pattern = "P 显然荒谬；因此无需回应 P。"
diagnostic = ["“荒谬”具体违反哪条定义、证据或推理规则？", "作者是否展示了错误，而非只表达反感？"]
example = "这套理论太离谱了，我根本不需要解释哪里有问题。"
boundary = "对广泛已知的错误，简短评价可能足够；但在争议论证中，仍需要可复核的失败点。"
confusions = ["强烈反驳", "appeal to ridicule", "常识判断"]
related = ["appeal-to-ridicule", "proof-by-assertion", "tone-policing"]

[[fallacy]]
id = "fallacy-fallacy"
name_zh = "谬误谬误"
name_en = "Fallacy Fallacy"
aliases = ["论证有谬误所以结论假", "argumentum ad logicam"]
category = "presumption"
kind = "informal"
severity = 3
definition = "因为某论证含有谬误，就推出其结论必为假。"
pattern = "支持 P 的论证 A 无效；因此 P 为假。"
diagnostic = ["结论是否有其他独立支持？", "论证失败只说明未获支持，还是已有反证证明其假？"]
example = "他推荐这本书时用了从众论证，所以这本书一定很差。"
boundary = "论证失败可以降低当前支持并加重举证不足；但不能自动产生反证。"
confusions = ["反证与未证", "结论真假", "举证失败"]
related = ["appeal-to-ignorance", "non-sequitur", "burden-of-proof-reversal"]

[[fallacy]]
id = "false-dilemma"
name_zh = "虚假两难"
name_en = "False Dilemma"
aliases = ["非黑即白", "虚假二分", "假两难"]
category = "presumption"
kind = "informal"
severity = 3
definition = "把多个可选项压缩成两个互斥选项，并排除中间、混合、条件性或替代方案。"
pattern = "要么 P，要么 Q；P 不可接受；因此 Q。"
diagnostic = ["是否存在第三种状态、程度或条件组合？", "P 与 Q 是否真的互斥且穷尽？"]
example = "你要么完全支持这项方案，要么就是不要解决问题。"
boundary = "真实决策有时只有两个法律或逻辑选项；关键在于是否证明穷尽性。"
confusions = ["有限选择", "政策取舍", "排除中间"]
related = ["false-trilimma", "affirming-a-disjunct", "perfectionist-fallacy"]

[[fallacy]]
id = "false-trilimma"
name_zh = "虚假三难"
name_en = "False Trilemma"
aliases = ["三选一谬误", "虚假三分"]
category = "presumption"
kind = "informal"
severity = 3
definition = "与虚假两难相同，但把选项包装成三个，仍没有证明选项穷尽或互斥。"
pattern = "只有 P、Q、R 三种可能；前三者皆不可取；因此结论 S。"
diagnostic = ["三个选项是否真正覆盖所有可能？", "是否存在组合、渐进或尚未列出的方案？"]
example = "面对隐私问题只有三种办法：全部公开、全面监控，或者关闭产品。"
boundary = "三难论证可以成立，只要选项确实穷尽、互斥且各自评估准确。"
confusions = ["分类框架", "穷尽划分", "多选项"]
related = ["false-dilemma", "false-equivalence", "perfectionist-fallacy"]

[[fallacy]]
id = "suppressed-evidence"
name_zh = "隐瞒证据"
name_en = "Suppressed Evidence"
aliases = ["遗漏关键证据", "选择性省略"]
category = "presumption"
kind = "informal"
severity = 3
definition = "论证忽略已知且会显著改变结论的证据，使余下材料看起来更强。"
pattern = "用 E1 推出 P；已知 E2 与 P 冲突；E2 未进入推理。"
diagnostic = ["是否存在会实质改变结论的已知材料？", "作者是否知道该材料却没有解释？"]
example = "报告只引用三名满意客户，却隐去同一调查中 80% 的低分反馈。"
boundary = "省略细节不必然是隐瞒；筛选必须与结论相关，并且作者已知或应知该关键材料。"
confusions = ["简洁概括", "card stacking", "cherry-picking"]
related = ["card-stacking", "selective-evidence", "cherry-picking"]

[[fallacy]]
id = "card-stacking"
name_zh = "堆牌说服"
name_en = "Card Stacking"
aliases = ["只摆有利材料", "宣传式筛选"]
category = "presumption"
kind = "rhetorical"
severity = 3
definition = "宣传中集中呈现有利事实、遮蔽不利事实，制造一面倒印象。"
pattern = "选择并排列支持 P 的材料；省略相反材料；因此受众认为 P 已被全面证明。"
diagnostic = ["材料选择标准是否公开？", "反方最有力的材料为何没有出现？"]
example = "产品页列满好评截图，却不展示公开投诉和退货率。"
boundary = "广告和法律辩护会有立场性选择；伦理与证据评估取决于是否误导、是否披露关键限制。"
confusions = ["suppressed evidence", "cherry-picking", "广告表达"]
related = ["suppressed-evidence", "selective-evidence", "cherry-picking"]

[[fallacy]]
id = "selective-evidence"
name_zh = "选择性举证"
name_en = "Selective Evidence"
aliases = ["挑证据", "单边证据"]
category = "presumption"
kind = "informal"
severity = 2
definition = "只寻找和呈现支持立场的数据，不按预先一致的规则纳入反例或失败结果。"
pattern = "在大量结果中挑选支持 P 的 E+，忽略 E− 和总体基准。"
diagnostic = ["纳入证据的规则是否在看见结果前确定？", "反例和不显著结果是否也被报告？"]
example = "列举十次预测成功，却不统计几十次没有公开的成功率。"
boundary = "研究可以聚焦子问题；但结论需要说明筛选标准和总体分母。"
confusions = ["聚焦", "cherry-picking", "suppressed evidence"]
related = ["card-stacking", "suppressed-evidence", "cherry-picking"]

[[fallacy]]
id = "argument-from-incredulity"
name_zh = "不可信论证"
name_en = "Argument from Incredulity"
aliases = ["我无法想象所以不可能", "诉诸难以相信"]
category = "presumption"
kind = "informal"
severity = 2
definition = "因为自己难以理解或想象某解释，就推出该解释不可能或不成立。"
pattern = "我无法理解 P 怎么可能；因此 P 为假。"
diagnostic = ["不理解是否等于逻辑上的不可能？", "是否有领域知识或更好解释能处理这个困难？"]
example = "这么多巧合怎么可能自然发生，所以我无法相信没有设计者。"
boundary = "对概率或机制的惊讶可以提出合理追问；但不能把个人认知限制当作反证。"
confusions = ["解释复杂", "诉诸无知", "概率直觉"]
related = ["appeal-to-ignorance", "appeal-to-common-sense", "unfalsifiable-conspiracy"]

[[fallacy]]
id = "kettle-logic"
name_zh = "水壶逻辑"
name_en = "Kettle Logic"
aliases = ["多重矛盾辩解", "同时使用互斥理由"]
category = "presumption"
kind = "dialectical"
severity = 2
definition = "为了摆脱同一指控，同时提出互相冲突的辩解，却不解释它们如何兼容。"
pattern = "我没有 P；即使 P 发生也没关系；即使其影响很坏也不是我做的。"
diagnostic = ["多个辩解能否同时为真？", "作者是否把后备理由当作已证明事实？"]
example = "我根本没看那份文件，而且我看到时上面的数字本来就错了。"
boundary = "替代性抗辩可以并列探索；但应明确标为不同假设，并处理相互矛盾。"
confusions = ["多假设推理", "否认与备选", "逻辑不一致"]
related = ["inconsistent-standards", "self-sealing-argument", "definitional-retreat"]

[[fallacy]]
id = "motte-and-bailey"
name_zh = "护城河与城堡"
name_en = "Motte-and-Bailey Fallacy"
aliases = ["退守弱主张", "强弱主张切换"]
category = "presumption"
kind = "dialectical"
severity = 3
definition = "提出一个强、有争议的主张；遭遇反驳后退到容易防守的弱主张，随后又把它当回强主张使用。"
pattern = "主张 P；受攻击后改称 P′（弱）；P′ 被接受；随后重新用 P 推结论。"
diagnostic = ["防守版本与原始目标是否同义？", "在获得支持后，作者是否悄悄恢复更强结论？"]
example = "先断言所有网络争论都由机器人操纵；被质疑后说“至少有网络机器人”；最后又用后者证明“所有反对声音都是假的”。"
boundary = "修正论点是理性行为；问题在于修正版本和最终用途前后不一致。"
confusions = ["合理收窄", "移动球门", "ivory tower"]
related = ["moving-the-goalposts", "definitional-retreat", "no-true-scotsman"]

[[fallacy]]
id = "gish-gallop"
name_zh = "信息洪流"
name_en = "Gish Gallop"
aliases = ["连珠炮式谬误", "以量压质"]
category = "presumption"
kind = "dialectical"
severity = 3
definition = "在短时间内抛出大量真假混杂、彼此独立的论点，使对手无法在合理时间内逐项回应。"
pattern = "一次提出 P1…Pn；对手只能回应少数；提出者把未回应当成胜利。"
diagnostic = ["每个论点是否有独立证据和回应时间？", "提出者是否把对方无法逐项处理误写成全部论点成立？"]
example = "一场十分钟发言塞进几十个指控，随后要求对方当场全部反驳。"
boundary = "复杂议题确实需要多项证据；关键在于是否给予合理回应成本，并为每个主张负责。"
confusions = ["信息密集论证", "proof by verbosity", "sealioning"]
related = ["proof-by-assertion", "sealioning", "shifting-burden-of-proof"]

[[fallacy]]
id = "sealioning"
name_zh = "海狮式纠缠"
name_en = "Sealioning"
aliases = ["礼貌式骚扰追问", "无限索取证据"]
category = "presumption"
kind = "dialectical"
severity = 2
definition = "以表面礼貌和持续追问为形式，无限要求证据或解释，却拒绝接受合理答案，消耗对方讨论资源。"
pattern = "不断要求来源、解释和更多证明；回答后继续增加要求；把拒绝无限回应说成对方回避。"
diagnostic = ["追问是否设置了可满足的终点？", "对方已给合理材料后，问题是否真正推进？"]
example = "你已给出公开报告、数据和方法，对方仍连续要求“再解释一遍”，却从不提出自己的主张。"
boundary = "持续提问是正常核实；判定海狮式纠缠需要重复模式、无限目标或明显不对等的举证要求。"
confusions = ["严谨追问", "合理好奇", "举证责任"]
related = ["jaqing-off", "moving-the-goalposts", "gish-gallop"]

[[fallacy]]
id = "jaqing-off"
name_zh = "我只是问问"
name_en = "JAQing Off"
aliases = ["装傻式提问", "just asking questions"]
category = "presumption"
kind = "rhetorical"
severity = 2
definition = "以“我只是提问”为保护壳传播指控或暗示，却不承担由暗示产生的举证责任。"
pattern = "反复问“是不是有某种可能”，在受众形成负面印象后否认自己作了主张。"
diagnostic = ["问题是否在重复暗示一个尚未证明的结论？", "提问者是否愿意为自己的暗示提供证据？"]
example = "我只是好奇，为什么偏偏这个时候公开报告？是不是有人想掩盖什么？"
boundary = "真诚澄清和调查式提问是必要的；判定需要看重复、暗示强度和拒绝承担主张责任。"
confusions = ["正常提问", "苏格拉底式提问", "sealioning"]
related = ["sealioning", "loaded-question", "burden-of-proof-reversal"]

[[fallacy]]
id = "non-sequitur"
name_zh = "不推出结论"
name_en = "Non Sequitur"
aliases = ["结论不跟随", "不相干结论"]
category = "presumption"
kind = "informal"
severity = 2
definition = "结论与前提之间缺少可说明的支持关系；它可能表面顺滑，却没有逻辑连接。"
pattern = "P；因此 C；无法说明 P 怎样增加 C 的可信度。"
diagnostic = ["从 P 到 C 需要哪些桥接前提？", "即使 P 为真，C 是否仍完全可能为假？"]
example = "这家餐厅已经开了十年，所以它的菜一定最有营养。"
boundary = "“不推出结论”是兜底描述，不应抢走更具体条目的位置；能精确描述断点时优先用具体机制。"
confusions = ["形式无效", "无关信息", "省略前提"]
related = ["fallacy-fallacy", "red-herring", "false-cause"]

[[fallacy]]
id = "inconsistent-standards"
name_zh = "标准不一致"
name_en = "Inconsistent Standards"
aliases = ["双标论证", "门槛不对称"]
category = "presumption"
kind = "dialectical"
severity = 3
definition = "对结构类似的主张使用不同证据门槛、解释宽容度或责任标准，而没有说明相关差异。"
pattern = "P 与 Q 在结论相关方面相同；对 P 使用严格标准，对 Q 使用宽松标准；因此只接受 Q。"
diagnostic = ["两组主张在哪些相关维度相似或不同？", "如果交换立场，我是否仍使用同一门槛？"]
example = "同一数据由自己团队发布就被称为可靠，由竞争对手发布就被要求提供原始记录。"
boundary = "不同来源、方法和风险可能支持不同门槛；问题在于差异未被证明且似乎随立场变化。"
confusions = ["special pleading", "tu quoque", "double standard"]
related = ["special-pleading", "tu-quoque", "false-balance"]
